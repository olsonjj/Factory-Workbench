<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9198a1" class="arrhead"/>
    </marker>
  </defs>
  <style>
    .panel  { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .chip   { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .tagg   { fill: #d9f2de; stroke: #b3dfc0; stroke-width: 1; }
    .t      { fill: #1f2328; font-size: 15px; font-weight: 650; }
    .n      { fill: #59636e; font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; }
    .d      { fill: #454c54; font-size: 10px; }
    .chipt  { fill: #454c54; font-size: 9.5px; }
    .greent { fill: #1a7f37; font-weight: 700; font-size: 9.5px; }
    .conn   { stroke: #9198a1; stroke-width: 1.5; }
    .arrhead{ fill: #9198a1; }
    .loop   { stroke: #8250df; stroke-width: 1.5; fill: none; opacity: 0.85; }
    .looptx { fill: #6639ba; font-size: 10px; font-weight: 600; }
    .hitl   { stroke: #bf8700; stroke-width: 1.5; fill: none; }
    .hitltx { fill: #bf8700; font-size: 11px; font-weight: 600; }
    .foot   { fill: #59636e; font-size: 10.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .panel  { fill: #151b23; stroke: #3d444d; }
      .chip   { fill: #0d1117; stroke: #3d444d; }
      .tagg   { fill: #0d1117; stroke: #2ea043; }
      .t      { fill: #e6edf3; }
      .n      { fill: #9198a1; }
      .d      { fill: #9198a1; }
      .chipt  { fill: #9198a1; }
      .greent { fill: #3fb950; }
      .conn   { stroke: #8b949e; }
      .arrhead{ fill: #8b949e; }
      .loop   { stroke: #ab7df8; }
      .looptx { fill: #d2a8ff; }
      .hitl   { stroke: #d29922; }
      .hitltx { fill: #d29922; }
    }
  </style>

  <!-- you: drop a markdown item -->
  <rect x="20" y="20" width="140" height="30" rx="15" class="chip" stroke-dasharray="4 3"/>
  <text x="90" y="40" text-anchor="middle" class="chipt">inbox/ · drop a .md item</text>
  <line x1="90" y1="52" x2="90" y2="102" class="conn" marker-end="url(#arr)"/>

  <!-- approvals bracket: spans spec..review -->
  <path d="M189 92 v-8 H811 v8" class="hitl"/>
  <text x="500" y="74" text-anchor="middle" class="hitltx">stages listed in approvals: park for your decision — wb approve · wb reject</text>

  <!-- stage cards -->
  <!-- 1 triage -->
  <g>
    <rect x="15" y="110" width="150" height="140" rx="10" class="panel"/>
    <text x="27" y="129" class="n">1 · AGENT</text>
    <text x="27" y="149" class="t">triage</text>
    <text x="27" y="168" class="d">decides whether the work</text>
    <text x="27" y="182" class="d">reaches the pipeline</text>
  </g>
  <line x1="169" y1="180" x2="185" y2="180" class="conn" marker-end="url(#arr)"/>

  <!-- 2 spec -->
  <g>
    <rect x="189" y="110" width="140" height="140" rx="10" class="panel"/>
    <text x="201" y="129" class="n">2 · AGENT</text>
    <text x="201" y="149" class="t">spec</text>
    <text x="201" y="168" class="d">repo + item + KB → plan</text>
    <text x="201" y="182" class="d">codebase-only · offline</text>
    <text x="201" y="196" class="d">plan saved as artifact</text>
  </g>
  <line x1="333" y1="180" x2="349" y2="180" class="conn" marker-end="url(#arr)"/>

  <!-- 3 implement -->
  <g>
    <rect x="353" y="110" width="140" height="140" rx="10" class="panel"/>
    <text x="365" y="129" class="n">3 · AGENT</text>
    <text x="365" y="149" class="t">implement</text>
    <text x="365" y="168" class="d">codebase-grounded edits</text>
    <text x="365" y="182" class="d">commits on factory/&lt;slug&gt;</text>
    <text x="365" y="196" class="d">consumes rework feedback</text>
  </g>
  <line x1="497" y1="180" x2="513" y2="180" class="conn" marker-end="url(#arr)"/>

  <!-- 4 test (gate) -->
  <g>
    <rect x="517" y="110" width="130" height="140" rx="10" class="panel"/>
    <rect x="521" y="115" width="3.5" height="130" rx="1.75" fill="#8250df"/>
    <text x="531" y="129" class="n">4 · AGENT · GATE</text>
    <text x="531" y="149" class="t">test</text>
    <text x="531" y="168" class="d">runs the test suite</text>
    <text x="531" y="182" class="d">failures → feedback</text>
  </g>
  <line x1="651" y1="180" x2="667" y2="180" class="conn" marker-end="url(#arr)"/>

  <!-- 5 review (gate) -->
  <g>
    <rect x="671" y="110" width="140" height="140" rx="10" class="panel"/>
    <rect x="675" y="115" width="3.5" height="130" rx="1.75" fill="#8250df"/>
    <text x="685" y="129" class="n">5 · AGENT · GATE</text>
    <text x="685" y="149" class="t">review</text>
    <text x="685" y="168" class="d">quality · security · best</text>
    <text x="685" y="182" class="d">practices (different model</text>
    <text x="685" y="196" class="d">family than implement)</text>
  </g>
  <line x1="815" y1="180" x2="831" y2="180" class="conn" marker-end="url(#arr)"/>

  <!-- 6 pull request -->
  <g>
    <rect x="835" y="110" width="150" height="140" rx="10" class="panel"/>
    <text x="847" y="129" class="n">6 · HOST</text>
    <text x="847" y="149" class="t">pull request</text>
    <text x="847" y="168" class="d">branch pushed; PR body is</text>
    <text x="847" y="182" class="d">the item's audit trail</text>
  </g>
  <rect x="835" y="268" width="150" height="20" rx="6" class="tagg"/>
  <text x="910" y="281.5" text-anchor="middle" class="greent">never merges</text>

  <!-- triage outcome chips -->
  <rect x="15" y="268" width="165" height="20" rx="6" class="chip"/>
  <text x="97" y="281.5" text-anchor="middle" class="chipt">reject → archive · resurrectable</text>
  <rect x="15" y="294" width="165" height="20" rx="6" class="chip"/>
  <text x="97" y="307.5" text-anchor="middle" class="chipt">needs-human → parked · wb answer</text>

  <!-- gate rework loop: test/review fail back into implement -->
  <path d="M741 258 C741 296 423 296 423 258" class="loop" marker-end="url(#arr)"/>
  <text x="582" y="304" text-anchor="middle" class="looptx">a failed gate feeds its findings back to implement</text>
  <text x="582" y="318" text-anchor="middle" class="looptx">≤ 3 attempts per gate — then the item parks with its full failure history</text>

  <!-- infra note -->
  <text x="15" y="372" class="foot">⟲ transient infra failures (model timeouts, sandbox flakes) retry with backoff on a separate budget — a flaky network never consumes a work item's rework rounds</text>
</svg>