name: CI

# The docker-gated real-agent integration tests (tests/integration/)
# deliberately self-skip in this workflow: they require a pre-built
# sandcastle:local image (built from the gitignored .sandcastle/Dockerfile
# via `npx sandcastle docker build-image`), a staged host ~/.pi/agent config
# (auth + model catalog for the sandboxed agent), and a git identity for the
# test harness commits. No runner preparation is done here, so CI runs the
# hermetic suite only. Re-enable them in a dedicated job that provisions all
# three before `npm test`.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test