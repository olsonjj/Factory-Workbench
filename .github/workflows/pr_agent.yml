# PR-Agent: AI code review on PRs (auto-runs on open/reopened/ready-for-review,
# skips drafts, manual commands like /review /improve /ask available per PR).
# LLM: Ollama Cloud via its OpenAI-compatible endpoint.
#
# Security notes:
# - The action is digest-pinned. The upstream action repo's wrapper (action.yaml)
#   only pins a wrapper file; the real runtime is the Docker Hub image
#   `pragent/pr-agent:github_action`, a MUTABLE rolling tag. Pinning the digest
#   of the immutable versioned tag `0.49.0-github_action` is what actually pins
#   the executing code. Upstream SECURITY.md recommends exactly this, and the
#   image publishes GitHub Artifact Attestations:
#   gh attestation verify "oci://index.docker.io/pragent/pr-agent@sha256:<digest>" --repo The-PR-Agent/pr-agent
#   To upgrade: check https://github.com/The-PR-Agent/pr-agent/releases, then
#   resolve the new digest:
#   docker buildx imagetools inspect pragent/pr-agent:<ver>-github_action --format '{{.Manifest.Digest}}'
# - Comments (issue_comment) are restricted to OWNER/MEMBER/COLLABORATOR so
#   strangers on this public repo can't burn Ollama API credits via /commands
#   or inject content into the LLM's posted output.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # - never trigger on the bot's own comments
    # - skip draft PRs (WIP code shouldn't be shipped to the LLM provider)
    # - issue_comment (commands like /review): only from OWNER/MEMBER/COLLABORATOR
    #   and only on PRs — the only trigger where a non-collaborator gets our
    #   secrets loaded into the run (fork PRs don't)
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'pull_request' &&
          !github.event.pull_request.draft
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        # digest of immutable tag pragent/pr-agent:0.49.0-github_action on Docker Hub
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- Ollama Cloud (OpenAI-compatible endpoint) ---
          OPENAI__API_BASE: https://ollama.com/v1
          OPENAI__KEY: ${{ secrets.OLLAMA_API_KEY }}

          # --- Model config ---
          CONFIG__MODEL: openai/glm-5.3-flash:cloud
          # avoid falling back to OpenAI's default model, which we don't have
          # a key for (must differ from CONFIG__MODEL)
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '128000'